name: Record a testplus

on:
  workflow_dispatch: 

jobs:
  record-stream:
    runs-on: ubuntu-latest

    env:
      tag_name: recording-${{ github.run_id }}

    steps:
      - name: disable initramfs
        run: sudo sed -i 's/yes/no/g' /etc/initramfs-tools/update-initramfs.conf
      - name: disable man-db
        run: sudo rm -f /var/lib/man-db/auto-update
      - name: Configure fast APT mirror
        uses: vegardit/fast-apt-mirror.sh@v1
        with: 
              exclude-current: true
      - name: install dependencies
        run: sudo apt-get update && sudo apt-get install -y mpv ffmpeg yt-dlp

      - name: mpv
        id: record
        continue-on-error: true
        run: |
          mkdir -p artifact/out
          ffmpeg -protocol_whitelist file,http,https,tcp,tls,crypto -i "https://live.eu-north-1a.cf.dmcdn.net/sec2(1pvc7EwMwiBexyy85NzMIY4qNxWOCXP-WKCC51zlUWCWua4p9oVwnQ9DGrE-bScFvw_sf0i7F9iwyHj6fZEQSQYwtBd3qFbIyzeculTe5hFWwnfnGiMyxlRgY2XYqrsrZidv7Vi7mFDq3AVxl1qWqNWEmMGl60NQgOuT1KspFFzxo4X2TCHlwVM3NkLmJoA5)/dm/3/x8qckyq/d/live-h264-720.m3u8" -i "https://live.eu-north-1a.cf.dmcdn.net/sec2(1pvc7EwMwiBexyy85NzMIY4qNxWOCXP-WKCC51zlUWCWua4p9oVwnQ9DGrE-bScFvw_sf0i7F9iwyHj6fZEQSQYwtBd3qFbIyzeculTe5hFWwnfnGiMyxlRgY2XYqrsrZidv7Vi7mFDq3AVxl1qWqNWEmMGl60NQgOuT1KspFFzxo4X2TCHlwVM3NkLmJoA5)/dm/3/x8qckyq/d/live-aac-128.m3u8" -c copy  recorded.mkv
          # mpv --vo=null --ao=null "https://live.eu-north-1b.cf.dmcdn.net/sec2(SPAM50G8_vK5G-DtubVD_RxSAUWVPJ7RcpxgdbZ1Iu6BPoFvlPQ07f5fX4iHBZlCxZ59q1kuSBVSJyV65bMmLvIHYJepcdyGFvqIoHBZ2O2rvvYzQ1Q92weLbFh7JQuV)/dm/3/x8qckyq/d/live-720.m3u8" --stream-record=artifact/out/recorded.ts

      - name: ts to mp4
        if: always()
        run: |
          if [ -f artifact/out/recorded.ts ]; then
            ffmpeg -i artifact/out/recorded.mkv -vcodec copy -acodec copy  artifact/out/recorded.mp4
            rm -rf artifact/out/recorded.mkv
          else
            echo "recorded.ts not found"
          fi

      - name: create release
        if: always()
        run: |
          gh release create "$tag_name" --repo "${{ github.repository }}" \
            --title "1🌈🌈🌈 - $tag_name" \
            --notes "1🌈🌈🌈" \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: upload artifacts to the release
        if: always()
        run: |
          repo=${{ github.repository }}
          tag_name=${{ env.tag_name }}
          for artifact_dir in ./artifact/*; do
            for artifact in "$artifact_dir"/*; do
              gh release upload "$tag_name" "$artifact" --repo "$repo" --clobber
            done
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup (optional)
        if: always()
        run: rm -rf artifact
